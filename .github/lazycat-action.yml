version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: drizzle-gate

build:
  toolchains: []
  run_buildscript: false

images:
  - id: drizzle-gate
    target: service
    service: drizzle-gate
    source: ghcr.io/drizzle-team/gateway
    channel: stable
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: Drizzle Gateway
      source: https://gateway.drizzle.team
      source_author: Drizzle Team
  private:
    enabled: true
    skip_if_version_exists: true
    name: Drizzle Gateway
    summary: "Drizzle Gateway LazyCat package published from GitHub Actions."
